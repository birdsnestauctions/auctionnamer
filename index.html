<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BNA Auction Copy Generator</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #1a1a1a; min-height: 100vh; }

header { background: #2D6B5E; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
header h1 { font-size: 17px; font-weight: 500; flex: 1; }
header span { font-size: 13px; opacity: 0.75; }
.header-gear { background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.75); padding: 4px; display: flex; align-items: center; border-radius: 6px; transition: background 0.15s, color 0.15s; }
.header-gear:hover { background: rgba(255,255,255,0.15); color: #fff; }
.header-gear svg { width: 18px; height: 18px; }

/* Settings */
#settings-screen { display: none; align-items: center; justify-content: center; min-height: calc(100vh - 52px); padding: 40px 24px; }
.settings-card { background: #fff; border-radius: 16px; padding: 40px 48px; max-width: 480px; width: 100%; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.settings-card h2 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
.settings-card > p { font-size: 14px; color: #666; margin-bottom: 28px; line-height: 1.5; }
.key-saved-msg { display: none; font-size: 12px; color: #2D6B5E; background: #f0f8f5; border: 1px solid #b0cec8; border-radius: 6px; padding: 8px 12px; margin-bottom: 16px; }
.settings-actions { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
.btn-danger { border-color: #f5c6c6; color: #c0392b; font-size: 12px; }
.btn-danger:hover { background: #fff3f3; }

/* Setup */
#setup-screen { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 52px); padding: 40px 24px; }
.setup-card { background: #fff; border-radius: 16px; padding: 40px 48px; max-width: 560px; width: 100%; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.setup-card h2 { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
.setup-card > p { font-size: 14px; color: #666; margin-bottom: 28px; line-height: 1.5; }
.no-key-notice { display: none; background: #fff8f0; border: 1px solid #f5d8a6; border-radius: 8px; padding: 12px 14px; font-size: 13px; color: #7a5000; margin-bottom: 20px; }
.no-key-notice a { color: #2D6B5E; cursor: pointer; text-decoration: underline; }

/* Mode toggle */
.mode-toggle { display: flex; gap: 0; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; margin-bottom: 24px; }
.mode-btn { flex: 1; padding: 9px 16px; font-size: 13px; font-family: inherit; border: none; background: #fff; color: #888; cursor: pointer; transition: background 0.15s, color 0.15s; }
.mode-btn.active { background: #2D6B5E; color: #fff; }
.mode-btn:first-child { border-right: 1px solid #ddd; }

.field-label { font-size: 12px; font-weight: 500; color: #555; margin-bottom: 6px; display: block; }
.field-input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; margin-bottom: 20px; outline: none; transition: border-color 0.15s; }
.field-input:focus { border-color: #2D6B5E; }
textarea.field-input { resize: vertical; min-height: 80px; line-height: 1.5; }

.drop-zone { background: #f9f9f7; border: 2px dashed #b0cec8; border-radius: 12px; padding: 32px; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; margin-bottom: 24px; }
.drop-zone.drag-over { border-color: #2D6B5E; background: #f0f8f5; }
.drop-zone p { font-size: 14px; color: #666; margin-bottom: 12px; }
.drop-zone .file-note { font-size: 11px; color: #aaa; margin: 8px 0 0; }

.btn { font-size: 13px; padding: 9px 18px; border-radius: 8px; border: 1px solid #ccc; background: #fff; color: #1a1a1a; cursor: pointer; font-family: inherit; white-space: nowrap; }
.btn:hover { background: #f5f5f3; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-teal { background: #2D6B5E; color: #fff; border-color: #2D6B5E; width: 100%; padding: 11px; font-size: 14px; }
.btn-teal:hover:not(:disabled) { background: #235549; }
.btn-ghost { border-color: #ddd; color: #888; font-size: 12px; }
.btn-ghost:hover { color: #1a1a1a; }
.btn-copy { font-size: 11px; padding: 5px 10px; border-color: #2D6B5E; color: #2D6B5E; background: #fff; }
.btn-copy:hover { background: #f0f8f5; }
.btn-copy.copied { background: #2D6B5E; color: #fff; }

#setup-error { display: none; background: #fff3f3; border: 1px solid #f5c6c6; color: #c0392b; border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
#file-chosen { font-size: 12px; color: #2D6B5E; margin: -16px 0 20px; display: none; }

/* App */
#app-screen { display: none; }
#app-toolbar { background: #fff; border-bottom: 1px solid #e8e8e6; padding: 10px 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: sticky; top: 0; z-index: 50; }
#app-label { font-size: 14px; font-weight: 500; flex: 1; }
#progress-info { font-size: 12px; color: #888; }
#gen-progress { display: none; background: #fff; border-bottom: 1px solid #e8e8e6; padding: 10px 24px; }
.prog-bar-track { width: 100%; height: 4px; background: #e8e8e6; border-radius: 2px; overflow: hidden; }
.prog-bar-fill { height: 100%; background: #2D6B5E; border-radius: 2px; width: 0%; transition: width 0.3s; }
#prog-label { font-size: 12px; color: #888; margin-top: 6px; }

#results-area { padding: 20px 24px 60px; }

/* Newsletter result */
.newsletter-card { background: #fff; border: 1px solid #e8e8e6; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
.newsletter-card-header { padding: 14px 16px 10px; border-bottom: 1px solid #f0f0ee; display: flex; align-items: center; justify-content: space-between; }
.newsletter-card-header h3 { font-size: 14px; font-weight: 500; }
.newsletter-card-body { padding: 14px 16px; }
.newsletter-text { font-size: 13px; line-height: 1.7; color: #1a1a1a; background: #f9f9f7; border-radius: 8px; padding: 14px 16px; white-space: pre-wrap; }

/* Lot cards */
.lot-card { background: #fff; border: 1px solid #e8e8e6; border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
.lot-card-header { display: flex; align-items: flex-start; justify-content: space-between; padding: 14px 16px 10px; border-bottom: 1px solid #f0f0ee; gap: 12px; }
.lot-card-meta { flex: 1; }
.lot-badge { display: inline-block; font-size: 10px; font-weight: 600; color: #fff; background: #2D6B5E; border-radius: 4px; padding: 2px 7px; margin-bottom: 4px; }
.lot-original-name { font-size: 12px; color: #999; margin-top: 2px; }
.lot-card-body { padding: 14px 16px; }
.copy-section { margin-bottom: 14px; }
.copy-section:last-child { margin-bottom: 0; }
.copy-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #aaa; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
.copy-text { font-size: 13px; line-height: 1.6; color: #1a1a1a; background: #f9f9f7; border-radius: 8px; padding: 10px 12px; white-space: pre-wrap; }

.pending-card { background: #fff; border: 1px solid #e8e8e6; border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; color: #999; font-size: 13px; }
.spinner { width: 16px; height: 16px; border: 2px solid #e8e8e6; border-top-color: #2D6B5E; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-card { background: #fff3f3; border: 1px solid #f5c6c6; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; font-size: 13px; color: #c0392b; }

.toast { position: fixed; bottom: 24px; right: 24px; background: #2D6B5E; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 200; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>BNA Auction Copy Generator</h1>
  <span>Bird's Nest Auctions</span>

</header>

<!-- Setup -->
<div id="setup-screen">
  <div class="setup-card">
    <h2>Generate auction copy</h2>
    <p>Upload your BidPath CSV export, choose what to generate, and the tool will write copy prioritized by estimated lot value.</p>
    <div id="setup-error"></div>

    <label class="field-label">What would you like to generate?</label>
    <div class="mode-toggle">
      <button class="mode-btn active" id="mode-auction" onclick="setMode('auction')">Auction description</button>
      <button class="mode-btn" id="mode-newsletter" onclick="setMode('newsletter')">Newsletter blurb</button>
    </div>

    <label class="field-label">BidPath CSV export</label>
    <div class="drop-zone" id="csv-drop">
      <p>Drop your CSV here or click to browse</p>
      <button class="btn btn-ghost" onclick="document.getElementById('csv-file-input').click()">Choose file</button>
      <p class="file-note">Same export used for the sort tool</p>
    </div>
    <input type="file" id="csv-file-input" accept=".csv" style="display:none">
    <div id="file-chosen"></div>
    <button class="btn btn-teal" id="generate-btn" onclick="startGeneration()" disabled>Generate</button>
  </div>
</div>

<!-- App -->
<div id="app-screen">
  <div id="app-toolbar">
    <span id="app-label">Generating...</span>
    <span id="progress-info"></span>
    <button class="btn btn-ghost" onclick="goBack()">← New auction</button>
  </div>
  <div id="gen-progress">
    <div class="prog-bar-track"><div class="prog-bar-fill" id="prog-fill"></div></div>
    <div id="prog-label">Starting...</div>
  </div>
  <div id="results-area"></div>
</div>

<div class="toast" id="toast"></div>

<script>
var lots = [], currentFilename = '', currentMode = 'auction';
var STORAGE_KEY = 'bna_anthropic_key';
var BATCH_SIZE = 5;

// ── Mode ──
function setMode(mode) {
  currentMode = mode;
  document.getElementById('mode-auction').className = 'mode-btn' + (mode === 'auction' ? ' active' : '');
  document.getElementById('mode-newsletter').className = 'mode-btn' + (mode === 'newsletter' ? ' active' : '');
}

// ── Pickup text persistence ──
// ── On load ──
window.addEventListener('load', function() {
  checkReady();
});

// ── CSV parser ──
// ── Generic CSV splitter ──
function splitCSVLine(line) {
  var cols = [], cur = '', inQ = false;
  for (var i = 0; i < line.length; i++) {
    var c = line[i];
    if (c === '"') {
      if (!inQ && cur === '') { inQ = true; }
      else if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else if (inQ) { var nx=line[i+1]; if(nx===','||nx===undefined||i===line.length-1) inQ=false; else cur+=c; }
      else cur += c;
    } else if (c === ',' && !inQ) { cols.push(cur); cur = ''; }
    else cur += c;
  }
  cols.push(cur);
  return cols;
}

// ── Generic CSV tokenizer (RFC4180-aware: handles embedded newlines, commas, and "" escaped quotes inside quoted fields) ──
function tokenizeCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.substring(1);
  var rows = [], row = [], field = '', inQuotes = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if (c === '"') { inQuotes = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip — handled by following \n */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter(function(r) { return !(r.length === 1 && r[0].trim() === ''); });
}

function stripHtml(str) {
  return (str || '').replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim();
}

function findCol(header, names) {
  for (var i = 0; i < names.length; i++) {
    var idx = header.indexOf(names[i]);
    if (idx >= 0) return idx;
  }
  return -1;
}

function parseCSV(text) {
  var rows = tokenizeCSV(text);
  if (!rows.length) return [];
  var header = rows[0].map(function(c) { return c.trim().toLowerCase(); });
  var nameIdx = findCol(header, ['name']);
  var lotIdx = findCol(header, ['lot#', 'lot #', 'lot', 'lot number', 'item #']);
  var descIdx = findCol(header, ['description']);
  var catIdx = findCol(header, ['category']);
  var sortIdx = findCol(header, ['sort order', 'sortorder']);

  var results = [];

  if (nameIdx >= 0 && lotIdx >= 0) {
    // Header-based parsing — covers AssetTrax exports and BidPath exports that include a header row
    for (var i = 1; i < rows.length; i++) {
      var cols = rows[i];
      if (!cols[nameIdx]) continue;
      results.push({
        item: cols[lotIdx] || '',
        lot: cols[lotIdx] || '',
        name: cols[nameIdx] || '',
        description: descIdx >= 0 ? stripHtml(cols[descIdx]) : '',
        category: catIdx >= 0 ? (cols[catIdx] || '') : '',
        sort: parseInt(sortIdx >= 0 ? cols[sortIdx] : '9999', 10) || 9999
      });
    }
  } else {
    // Fallback — legacy headerless BidPath export: item, lot, name, image, sortOrder columns positionally
    for (var j = 1; j < rows.length; j++) {
      var c = rows[j];
      if (c.length < 3 || !c[2]) continue;
      results.push({ item: c[0] || '', lot: c[1] || '', name: c[2] || '', description: '', category: '', sort: parseInt(c[4], 10) || 9999 });
    }
  }
  return results;
}

// ── File handling ──
var csvDrop = document.getElementById('csv-drop'), csvInput = document.getElementById('csv-file-input');
csvDrop.addEventListener('dragover', function(e) { e.preventDefault(); csvDrop.classList.add('drag-over'); });
csvDrop.addEventListener('dragleave', function() { csvDrop.classList.remove('drag-over'); });
csvDrop.addEventListener('drop', function(e) { e.preventDefault(); csvDrop.classList.remove('drag-over'); if (e.dataTransfer.files[0]) readCSV(e.dataTransfer.files[0]); });
csvDrop.addEventListener('click', function(e) { if (e.target === csvDrop) csvInput.click(); });
csvInput.addEventListener('change', function() { if (csvInput.files[0]) { readCSV(csvInput.files[0]); csvInput.value = ''; } });

function readCSV(file) {
  if (!file.name.toLowerCase().endsWith('.csv')) { showSetupError('Please upload a .csv file.'); return; }
  currentFilename = file.name;
  var r = new FileReader();
  r.onload = function(e) {
    lots = parseCSV(e.target.result);
    if (!lots.length) { showSetupError('No lots found. This tool accepts both BidPath custom exports and AssetTrax CSV exports.'); return; }
    hideSetupError();
    var fc = document.getElementById('file-chosen');
    fc.textContent = '✓ ' + file.name + ' — ' + lots.length + ' lots loaded';
    fc.style.display = 'block';
    checkReady();
  };
  r.readAsText(file);
}

function checkReady() {
  document.getElementById('generate-btn').disabled = !(lots.length > 0);
}

// ── Generation ──
function startGeneration() {
  if (!lots.length) return;
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  var auctionName = currentFilename.replace(/\.csv$/i, '');
  var modeLabel = currentMode === 'newsletter' ? 'Newsletter blurb' : 'Auction description';
  document.getElementById('app-label').textContent = auctionName + ' — ' + modeLabel;
  document.getElementById('gen-progress').style.display = 'block';
  document.getElementById('results-area').innerHTML = '';

  if (currentMode === 'newsletter') {
    generateNewsletter('', lots);
  } else {
    generateAuctionCopy('', lots);
  }
}

// ── Newsletter ──
function generateNewsletter(apiKey, allLots) {
  var results = document.getElementById('results-area');
  var card = document.createElement('div');
  card.className = 'pending-card';
  card.innerHTML = '<div class="spinner"></div><span>Writing newsletter blurb for ' + allLots.length + ' lots...</span>';
  results.appendChild(card);
  updateProgress(0, 1, 'Writing newsletter blurb...');

  var lotList = allLots.map(function(l) {
    var line = '[Lot ' + l.lot + '] ' + l.name;
    if (l.category) line += ' (' + l.category + ')';
    if (l.description) line += ' — ' + l.description.substring(0, 200);
    return line;
  }).join('\n');

  callClaude(apiKey, [{
    role: 'user',
    content: 'Here are the ' + allLots.length + ' lots in an upcoming Bird\'s Nest Auctions estate auction in Southern New Hampshire or northeastern Massachusetts. Exact lot count: ' + allLots.length + ' (use this if you mention a number, or round down to ' + (Math.floor(allLots.length/10)*10) + '+).\n\n' + lotList + '\n\nPRIORITY ORDER for standouts:\n1. Precious metals & jewelry: gold, sterling, fine jewelry, coins, watches\n2. Signed/named art: original paintings, signed prints — name the artist\n3. Named collectibles: specific pottery makers, Tiffany, Waterford, Fenton, Lowell Davis, Coca-Cola, Lionel, militaria, vintage toys, trading cards\n4. Antique/named rugs\n5. Named vintage furniture ONLY if genuinely collectible (MCM, Drexel, Stickley, French Provincial) — skip generic modern furniture\n6. Tools if notable\n\nWrite a newsletter blurb of 2-3 sentences in the voice of Bird\'s Nest Auctions. Study these real examples carefully and match this voice exactly:\n\n"The office team has been busy putting this auction together - find sterling silver, home goods, ephemera, linens and much more!"\n\n"This home in Dover has a really nice assortment of higher end furniture and decor, vintage apparel, costume jewelry, pretty quilts and Pendleton blankets, and so much more."\n\n"This auction at our HQ is bringing the mix this week: vintage goods, eye-catching artwork, his & hers bikes, and a handful of unexpected gems (looking at you, Henriot Quimper France Breton Faience plates and men\'s Seiko watches) that make this one worth a closer look."\n\n"There are over 470 lots from this Windham estate, with Bauhaus seating, MCM carved tables, Capodimonte figurines, vintage holiday glassware, and a 1967 Disneyland LP. There\'s also patio furniture and deals on essentials for you to scoop up."\n\n"This auction in Londonderry leans into the charm; an easy mix of everyday home goods, quirky collectibles, and fun vintage finds, with a standout sterling silver flatware set."\n\n"This Raymond estate brings the garden to you, packed with outdoor décor, planters, birdhouses, and raised beds. This is the post-winter therapy we all need. (Also, please check out the cutest McCoy planter we have ever seen.)"\n\n"This same Raymond estate is a full house inside with 570+ lots covering everything from vintage furniture to tools, with standout pieces like a glowing GWTW parlor lamp, a signed lighthouse seascape painting and a vintage Pyrex milk glass butter dish. There\'s so much here!!"\n\nVOICE RULES — follow these strictly:\n- Sound like a real person who has been in the house and is tipping off a friend\n- Name specific weird or exciting items with genuine enthusiasm when the data supports it\n- Parenthetical asides with personality are welcome: "(looking at you, [item name])" or "(the cutest thing we\'ve seen in a while)"\n- Use character words: "leans into the charm," "bringing the mix," "character-filled," "unexpected gems"\n- Mention deals or practical appeal when relevant\n- NEVER use: "collectors," "run of," "treasure trove," "curated" (unless quoting a title), "don\'t miss out," "something for everyone"\n- No marketing-speak, no generic filler\n- No china cabinets or desks as standouts\n- Return only the blurb text, no headers, no formatting'
  }], 400).then(function(text) {
    card.remove();
    var resultCard = document.createElement('div');
    resultCard.className = 'newsletter-card';
    resultCard.innerHTML =
      '<div class="newsletter-card-header"><h3>Newsletter blurb</h3><button class="btn btn-copy" onclick="copyText(this,\'newsletter-text\')">Copy</button></div>' +
      '<div class="newsletter-card-body"><div class="newsletter-text" id="newsletter-text">' + esc(text.trim()) + '</div></div>';
    results.appendChild(resultCard);
    document.getElementById('gen-progress').style.display = 'none';
    document.getElementById('progress-info').textContent = 'Done';
    showToast('Newsletter blurb ready!');
  }).catch(function(err) {
    card.remove();
    var errCard = document.createElement('div');
    errCard.className = 'error-card';
    errCard.textContent = 'Error: ' + err.message;
    results.appendChild(errCard);
    document.getElementById('gen-progress').style.display = 'none';
  });
}

// ── Auction description ──
function generateAuctionCopy(apiKey, allLots) {
  var lotList = allLots.map(function(l) {
    var line = '[Lot ' + l.lot + '] ' + l.name;
    if (l.category) line += ' (' + l.category + ')';
    if (l.description) line += ' — ' + l.description.substring(0, 200);
    return line;
  }).join('\n');
  var results = document.getElementById('results-area');
  var card = document.createElement('div');
  card.className = 'pending-card';
  card.innerHTML = '<div class="spinner"></div><span>Reviewing ' + allLots.length + ' lots and writing auction description...</span>';
  results.appendChild(card);
  updateProgress(0, 1, 'Writing auction description...');

  var valueHierarchy = 'VALUE HIERARCHY — prioritize standouts in this order:\n1. Precious metals & jewelry: gold, sterling silver, fine jewelry, coins, watches\n2. Signed / named art: original paintings, signed prints, sculptures — name the artist if known\n3. Named collectibles with real collector markets: specific pottery makers (Roseville, Hull, McCoy, Rookwood, signed studio pottery), Tiffany, Waterford, Fenton, Lowell Davis, Coca-Cola, Lionel trains, militaria, vintage toys, trading cards\n4. Antique & named rugs: Persian, hand-knotted, named makers\n5. Named vintage/antique furniture ONLY if it has a collector market: MCM, Drexel, Stickley, Heywood-Wakefield, painted country antiques, French Provincial. DO NOT highlight generic modern furniture, particle board pieces, or unnamed upholstered sets — these are BNA\'s lowest-selling category. Only mention furniture if it\'s genuinely exceptional.\n6. Tools & workshop: named power tools, full sets, vintage hand tools\n7. General categories: fill out the picture but don\'t lead with these';

  callClaude(apiKey, [{
    role: 'user',
    content: 'Here are the ' + allLots.length + ' lots in an upcoming Bird\'s Nest Auctions estate auction in Southern New Hampshire or northeastern Massachusetts. This auction has exactly ' + allLots.length + ' lots — if you mention a lot count, use this exact number (or round down to nearest 10, e.g. ' + (Math.floor(allLots.length/10)*10) + '+). Never estimate.\n\n' + lotList + '\n\n' + valueHierarchy + '\n\n---\n\nWrite two things:\n\n1. HEADLINE: A title for this auction listing. Study these real BNA auction titles carefully — match this style exactly:\n- "Exeter NH: Fine Furniture, Antique Rugs, Silver & Curated Collectibles"\n- "Rye, NH: Classic New England Estate"\n- "Concord NH: From Antique Chippendale to Home Gym!"\n- "Downsize in Weare: Vinyl Records, Tools, Cast Iron, Vintage Collectibles & More"\n- "Derry HQ August Auction Spectacular: Uranium Glass, Fun Collectibles, Sterling and More!"\n- "Portsmouth NH: German Heirlooms, Fine Jewelry, Vintage Furnishings & Collector\'s Treasures"\n- "Billerica Estate Treasure Trove: Massive Coca-Cola Collection, Holiday and More!"\n- "Manchester, NH: U.S. Army Militaria, Vintage Books & Collector\'s Ephemera"\n- "Laconia NH: From Attic to Garage, A Classic Estate Auction"\n- "Methuen, MA: French Provincial Furniture, Ruby Red Glass & Curiosities"\n- "Hollis NH Estate: Fine Art, Sterling Silver & Antique Furnishings"\n- "Londonderry NH: Sprawling Multi-Room Estate Auction with Fine Art, Sterling Silver & Gold, Jewelry, Furniture & More"\n- "Kingston, NH: Vintage Finds, Sewing & More!"\n- "Historic 1786 Hancock Estate: Antiques, Vintage, Trading Cards and More!"\n- "Lee NH: Worldly Treasures, Art & Collectibles"\nRules: Almost always include city/town and state. Use ":" to separate location from content. Mix "&" and "and". Use "!" selectively. Name specific items or categories that are actually exciting — not generic filler. Can be short and evocative if the estate speaks for itself.\n\n2. DESCRIPTION: Exactly ONE paragraph. Warm, direct, knowledgeable — like someone who actually knows antiques talking to bidders. Rules:\n- Vary the opening every time (never start with "This auction features" or "This sale features")\n- Call out 5-7 specific standout items or tight categories by name, using the value hierarchy above\n- Cover the general breadth of the auction in 1-2 sentences\n- End with something light: "Don\'t miss this one!" or "Something for everyone — happy bidding!" or similar\n- No china cabinets or desks as standouts\n- No filler phrases ("treasure trove of possibilities", "we\'re excited to bring you")\n- No bullet points, no multiple paragraphs — one paragraph only, 3-8 sentences\n\nReturn ONLY valid JSON: {"headline": "...", "description": "..."}. No other text.'
  }], 900).then(function(text) {
    card.remove();
    var parsed;
    try { parsed = JSON.parse(text.replace(/```json|```/g,'').trim()); } catch(e) { parsed = { headline: '', description: text.trim() }; }
    var resultCard = document.createElement('div');
    resultCard.className = 'newsletter-card';
    resultCard.innerHTML =
      '<div class="newsletter-card-header"><h3>Auction description</h3></div>' +
      '<div class="newsletter-card-body">' +
      '<div class="copy-label" style="margin-bottom:6px;">Headline <button class="btn btn-copy" onclick="copyText(this,\'auction-headline-text\')">Copy</button></div>' +
      '<div class="newsletter-text" id="auction-headline-text" style="margin-bottom:14px;font-weight:500;">' + esc(parsed.headline || '') + '</div>' +
      '<div class="copy-label" style="margin-bottom:6px;">Description <button class="btn btn-copy" onclick="copyText(this,\'auction-desc-text\')">Copy</button></div>' +
      '<div class="newsletter-text" id="auction-desc-text">' + esc(parsed.description || '') + '</div>' +
      '</div>';
    results.appendChild(resultCard);
    document.getElementById('gen-progress').style.display = 'none';
    document.getElementById('progress-info').textContent = 'Done';
    showToast('Auction description ready!');
  }).catch(function(err) {
    card.remove();
    var errCard = document.createElement('div');
    errCard.className = 'error-card';
    errCard.textContent = 'Error: ' + err.message;
    results.appendChild(errCard);
    document.getElementById('gen-progress').style.display = 'none';
  });
}

function callClaude(apiKey, messages, maxTokens) {
  return fetch('https://bna-claude-proxy.onrender.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: maxTokens || 1000, messages: messages })
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.error) throw new Error(data.error.message || 'API error');
    var text = data.content && data.content[0] && data.content[0].text;
    if (!text) throw new Error('Empty response');
    return text;
  });
}

function copyText(btn, id) {
  var el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.innerText || el.textContent).then(function() {
    btn.textContent = 'Copied!'; btn.classList.add('copied');
    setTimeout(function() { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
  });
}
function updateProgress(done, total, label) {
  document.getElementById('prog-fill').style.width = (total > 0 ? Math.round(done/total*100) : 0) + '%';
  document.getElementById('prog-label').textContent = label || (done + ' of ' + total);
}
function goBack() {
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('setup-screen').style.display = 'flex';
  document.getElementById('results-area').innerHTML = '';
  lots = []; document.getElementById('file-chosen').style.display = 'none';
  checkReady();
}
function showSetupError(msg) { var el=document.getElementById('setup-error'); el.textContent=msg; el.style.display='block'; }
function hideSetupError() { document.getElementById('setup-error').style.display='none'; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(msg) { var el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); setTimeout(function(){ el.classList.remove('show'); },2400); }
</script>
</body>
</html>
